
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "dxmohammad-nlp-toolkit"
version = "0.1.1"
description = "A modular Python toolkit for text preprocessing, linguistic analysis, and text vectorization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Mohammad" }
]

keywords = [
    "nlp",
    "natural-language-processing",
    "text-processing",
    "tokenization",
    "lemmatization",
    "stemming",
    "text-vectorization"
]

dependencies = [
    "nltk>=3.8",
    "spacy>=3.7",
    "scikit-learn>=1.2",
    "scipy>=1.10"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/dxmohammad/nlp-toolkit"
Repository = "https://github.com/dxmohammad/nlp-toolkit"
Issues = "https://github.com/dxmohammad/nlp-toolkit/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["nlp_toolkit*"]
exclude = ["tests*"]
